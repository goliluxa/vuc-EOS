name: vuc-eos

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vuc-eos-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vuc-eos-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./storage_data:/app/storage_data
    environment:
      - DATABASE_URL=sqlite:////app/storage_data/storage.db
      - STORAGE_BASE_DIR=/app/storage_data
