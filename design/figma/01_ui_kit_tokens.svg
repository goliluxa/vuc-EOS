<svg width="1440" height="1100" viewBox="0 0 1440 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="1100" fill="#F8FAFC" />
  
  <!-- Header -->
  <text x="80" y="80" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#071E3D">ИОС ВУЦ — UI Kit &amp; Design Tokens</text>
  <text x="80" y="110" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Корпоративная дизайн-система Военного учебного центра ЧГУ им. И. Н. Ульянова</text>
  <line x1="80" y1="130" x2="1360" y2="130" stroke="#E2E8F0" stroke-width="1" />

  <!-- Section: Color Palette -->
  <text x="80" y="170" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#071E3D">1. Цветовая палитра (Color Palette)</text>
  
  <g transform="translate(80, 190)">
    <!-- Deep Navy -->
    <rect x="0" y="0" width="130" height="90" rx="8" fill="#071E3D" />
    <text x="0" y="110" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Deep Navy</text>
    <text x="0" y="128" font-family="monospace" font-size="11" fill="#64748B">#071E3D</text>

    <!-- Brand Navy -->
    <rect x="150" y="0" width="130" height="90" rx="8" fill="#0F3A78" />
    <text x="150" y="110" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Brand Navy</text>
    <text x="150" y="128" font-family="monospace" font-size="11" fill="#64748B">#0F3A78</text>

    <!-- Military Blue -->
    <rect x="300" y="0" width="130" height="90" rx="8" fill="#2563EB" />
    <text x="300" y="110" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Military Blue</text>
    <text x="300" y="128" font-family="monospace" font-size="11" fill="#64748B">#2563EB</text>

    <!-- Military Red -->
    <rect x="450" y="0" width="130" height="90" rx="8" fill="#DC2626" />
    <text x="450" y="110" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Military Red</text>
    <text x="450" y="128" font-family="monospace" font-size="11" fill="#64748B">#DC2626</text>

    <!-- Page BG -->
    <rect x="600" y="0" width="130" height="90" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="600" y="110" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Surface BG</text>
    <text x="600" y="128" font-family="monospace" font-size="11" fill="#64748B">#F8FAFC</text>

    <!-- Card Surface -->
    <rect x="750" y="0" width="130" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="750" y="110" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Surface Card</text>
    <text x="750" y="128" font-family="monospace" font-size="11" fill="#64748B">#FFFFFF</text>

    <!-- Border -->
    <rect x="900" y="0" width="130" height="90" rx="8" fill="#E2E8F0" />
    <text x="900" y="110" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Surface Border</text>
    <text x="900" y="128" font-family="monospace" font-size="11" fill="#64748B">#E2E8F0</text>
  </g>

  <!-- Section: Buttons -->
  <text x="80" y="380" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#071E3D">2. Кнопки (Button Components)</text>

  <g transform="translate(80, 410)">
    <!-- Primary Red CTA -->
    <rect x="0" y="0" width="180" height="48" rx="6" fill="#DC2626" />
    <text x="90" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Войти в систему →</text>
    <text x="0" y="68" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Primary CTA (Red)</text>

    <!-- Primary Navy -->
    <rect x="220" y="0" width="160" height="48" rx="6" fill="#0F3A78" />
    <text x="300" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Сохранить</text>
    <text x="220" y="68" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Primary Action (Navy)</text>

    <!-- Outline Button -->
    <rect x="420" y="0" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="500" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0F172A" text-anchor="middle">Отмена</text>
    <text x="420" y="68" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Secondary Outline</text>

    <!-- Danger Button -->
    <rect x="620" y="0" width="160" height="48" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
    <text x="700" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#DC2626" text-anchor="middle">Удалить</text>
    <text x="620" y="68" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Danger Light</text>
  </g>

  <!-- Section: Role & Status Badges -->
  <text x="80" y="540" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#071E3D">3. Бейджи ролей и статусов (Badges &amp; Chips)</text>

  <g transform="translate(80, 570)">
    <!-- Cadet Badge -->
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#EFF6FF" />
    <text x="55" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">Курсант</text>

    <!-- Teacher Badge -->
    <rect x="130" y="0" width="130" height="28" rx="14" fill="#ECFDF5" />
    <text x="195" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="middle">Преподаватель</text>

    <!-- Officer Badge -->
    <rect x="280" y="0" width="110" height="28" rx="14" fill="#F5F3FF" />
    <text x="335" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" text-anchor="middle">Начальник</text>

    <!-- Admin Badge -->
    <rect x="410" y="0" width="130" height="28" rx="14" fill="#FEF2F2" />
    <text x="475" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">Администратор</text>

    <!-- Lecture Pill -->
    <rect x="560" y="0" width="90" height="28" rx="6" fill="#F1F5F9" />
    <text x="605" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#0F172A" text-anchor="middle">Лекция</text>

    <!-- Practice Pill -->
    <rect x="670" y="0" width="160" height="28" rx="6" fill="#EFF6FF" />
    <text x="750" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#2563EB" text-anchor="middle">Практическое занятие</text>

    <!-- Self-study Pill -->
    <rect x="850" y="0" width="140" height="28" rx="6" fill="#FFFBEB" />
    <text x="920" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#F59E0B" text-anchor="middle">Самоподготовка</text>
  </g>

  <!-- Section: Form Inputs -->
  <text x="80" y="670" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#071E3D">4. Поля ввода (Inputs)</text>

  <g transform="translate(80, 700)">
    <!-- Label -->
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Логин или военный билет</text>
    <!-- Normal Input -->
    <rect x="0" y="10" width="340" height="44" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="37" font-family="Inter, sans-serif" font-size="14" fill="#64748B">smirnov_av</text>

    <!-- Label -->
    <text x="380" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Пароль доступа (Focused)</text>
    <!-- Focused Input -->
    <rect x="380" y="10" width="340" height="44" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
    <text x="394" y="37" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">••••••••••••</text>
  </g>

  <!-- Section: Typography -->
  <text x="80" y="820" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#071E3D">5. Типографика (Typography Scale)</text>

  <g transform="translate(80, 850)">
    <text x="0" y="30" font-family="Inter, sans-serif" font-size="36" font-weight="900" fill="#071E3D">Heading 1 / 36px Black (ИОС ВУЦ)</text>
    <text x="0" y="70" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#071E3D">Heading 2 / 24px Bold (Расписание учебного военного дня)</text>
    <text x="0" y="105" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#071E3D">Heading 3 / 18px Semibold (Общая военная подготовка)</text>
    <text x="0" y="135" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#0F172A">Body Regular / 14px Regular (Единое цифровое пространство для образовательной деятельности)</text>
    <text x="0" y="160" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Caption / 12px Medium (Взвод 141 • Кафедра ОВП • 72 часа)</text>
  </g>
</svg>