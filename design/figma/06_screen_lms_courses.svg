        <text x="0" y="138" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748B">Пройдено: 12 из 36 часов (33%)</text>
        <text x="497" y="138" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" text-anchor="end">4 урока • 7 файлов</text>

